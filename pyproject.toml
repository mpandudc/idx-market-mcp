[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "idx-market-mcp"
version = "1.0.0"
description = "FastMCP server for Indonesian Stock Exchange (IDX) market data, bandarmology, Level 2 orderbook, and quantitative risk budgeting."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Muhammad Pandu Dwi Cahyo", email = "mpandudc@gmail.com" }
]
keywords = [
    "mcp",
    "fastmcp",
    "idx",
    "indonesia-stock-exchange",
    "bandarmology",
    "orderbook",
    "stockbit",
    "quantitative-finance"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "fastmcp>=0.4.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "matplotlib>=3.8.0",
    "mplfinance>=0.12.10b0",
]

[project.scripts]
idx-market-mcp = "idx_market_data_mcp.server:mcp.run"

[tool.hatch.build.targets.wheel]
packages = ["src/idx_market_data_mcp"]
